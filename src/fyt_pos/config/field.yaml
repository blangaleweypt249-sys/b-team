field_localizer:
  ros__parameters:
    # FAST-LIO 输出的是雷达坐标系位姿，节点会按下方外参换算为车体中心位姿。
    odometry_topic: /Odometry
    field_pose_topic: /competition/field_pose
    field_zone_topic: /competition/current_zone
    # 启动区静止时采样建立比赛坐标原点；采样期间不会发布场地位姿。
    initial_sample_count: 30
    field_yaw_offset_deg: -90.0
    # 抽签后改为对应起点；本方起点始终是 (0, 0)，向场内和朝赛场中线移动均为正。
    # 左下角为 bottom_left，右下角为 bottom_right。
    start_corner: bottom_left
    # 这三项必须随雷达安装位置和朝向重新标定，单位为米和度。
    lidar_to_base_enabled: true
    base_to_lidar_x_m: -0.205
    base_to_lidar_y_m: 0.16
    base_to_lidar_yaw_deg: -90.0
    # 车体尺寸: 车体中心初始位置 = (车宽/2, 车长/2)。
    base_length_m: 0.70
    base_width_m: 0.56
    allowed_min_x: 0.0
    allowed_max_x: 11.0
    allowed_min_y: 0.0
    allowed_max_y: 6.0
    # 每个区域为 [最小 x, 最大 x, 最小 y, 最大 y]，坐标单位为米。
    zones:
      names: [start, block, public, gem_pick, red_goal, blue_goal, special1, special2, pub1, pub2]
      start: [0.0, 0.7, 0.0, 0.7]
      #storage_l1: [1.20, 2.60, 5.6, 6.0]
      #storage_l2: [0.0, 1.2, 5.394, 6.0]
      block: [0.0, 3.0, 2.7, 6.0]
      public: [3.05, 7.95, 0.0, 6.0]
      gem_pick: [4.8, 5.2, 1.6, 2.3]
      red_goal: [7.45, 7.95, 4.359, 4.859]
      blue_goal: [3.05, 3.55, 4.359, 4.859]
      special1: [4.5, 6.5, 0.0, 5.9]
      special2: [4.5, 6.5, 4.6, 6.0]
      pub1: [3.05, 3.55, 1.605, 2.105]
      pub2: [7.45, 7.95, 1.605, 2.105]

field_visualizer:
  ros__parameters:
    field_pose_topic: /competition/field_pose
    marker_topic: /competition/field_markers

simple_position:
  ros__parameters:
    # 用于快速验证 LiDAR 定位：首帧为原点，不进行车体外参或赛场坐标转换。
    odometry_topic: /Odometry
    position_topic: /lidar/relative_position
    print_period_s: 0.5